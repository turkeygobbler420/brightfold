# Deploys to the Vercel project "brightfold" (needed for /api/postback, which GitHub Pages cannot run).
# One-time setup: add repo secret VERCEL_TOKEN (Vercel -> Account Settings -> Tokens).
# Until that secret exists the job is skipped.
name: Deploy to Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_GGDinKdu4Yi2koehP2lC1mU5
      VERCEL_PROJECT_ID: prj_Zy9h0uKVl98vbh694eJxOprkA75Y
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (skipped if VERCEL_TOKEN is not set)
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
