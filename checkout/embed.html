<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<title>Brightfold embedded checkout</title>
<style>
  :root{--ink:#121212;--muted:#666;--line:#e5e7eb;--accent:#4f46e5;--bg:#fff}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
  .wrap{padding:18px;max-width:440px;margin:0 auto}
  .row{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px}
  .muted{font-size:13px;color:var(--muted);margin-bottom:14px}
  .total{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
  .btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.6;cursor:default}
  .msg{text-align:center;font-size:13px;color:var(--muted);margin:12px 0 0;min-height:18px}
  .note{text-align:center;font-size:12px;color:#888;margin:8px 0 0}
  .duo{display:flex;gap:10px;margin-bottom:12px}
  .stile{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .stile span{display:block;font-size:12px;color:var(--muted)}
  .stile b{display:block;font-size:18px}
  .stile small{display:block;font-size:12px;color:var(--muted)}
  .checks{list-style:none;padding:0;margin:0 0 14px}
  .checks li{font-size:13px;padding:4px 0 4px 18px;position:relative}
  .checks li:before{content:'✓';position:absolute;left:0;color:#16a34a;font-weight:700}
</style>
<div class="wrap">
  <div class="duo">
    <div class="stile"><span>Today</span><b id="amount">$1.00</b><small id="trial">7-day trial</small></div>
    <div class="stile"><span>Then</span><b id="interval">29.99$</b><small>every 28 days</small></div>
  </div>
  <ul class="checks">
    <li>IQ score report</li>
    <li>Detailed cognitive report</li>
    <li>Global &amp; country ranking</li>
  </ul>
  <button id="pay" class="btn" type="button" disabled>Pay</button>
  <p id="msg" class="msg"></p>
  <p class="note">&#128274; Encrypted, secure payment</p>
</div>
<script src="embed.js?v=20261286"></script>
</body>
</html>
