<script>
(function(){var done=false,ACT=function(){HOME('training')};
function ready(){return window.BF_HOME&&window.BF_AUTH!==undefined||document.querySelector('.js-start');}
function HOME(tab){var A=window.BF_AUTH,H=window.BF_HOME;if(!H)return;
 var u=A&&A.user&&A.user(),d=window.BF_STORE&&window.BF_STORE.demoUser&&window.BF_STORE.demoUser();
 if(u||d){done=true;H.open(tab);}else if(A&&A.manage){done=true;var b=document.querySelector('.nav-login');if(b)b.click();}}
function MANAGE(){var A=window.BF_AUTH;if(!A)return;done=true;if(A.user&&A.user())A.manage();else{var b=document.querySelector('.nav-login');if(b)b.click();}}
function START(){var b=document.querySelector('.js-start');if(b&&window.BF_STORE){done=true;b.click();}}
function PAY(){var P=window.BF_PAY;if(P&&P.start()){done=true;}}
window.__run=function(){done=false;ACT();};
document.getElementById('acBtn').onclick=window.__run;
var n=0,t=setInterval(function(){if(!done)ACT();if(done||++n>40)clearInterval(t);},250);})();
</script>
